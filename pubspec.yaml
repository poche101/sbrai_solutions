name: sbrai_solutions
description: "A new Flutter project for Store Hub Account Selection."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.0.7
  cupertino_icons: ^1.0.8
  url_launcher: ^6.2.5
  http: ^1.1.0
  intl: ^0.20.2
  file_picker: ^11.0.2
  shared_preferences: ^2.2.0
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.1.1
  path: ^1.9.0
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^17.0.0
  provider: ^6.1.1
  firebase_database: ^12.3.0
  firebase_storage: ^13.3.0
  agora_rtc_engine: ^6.6.3
  cached_network_image: ^3.4.1
  pusher_channels_flutter: ^2.0.0
  permission_handler: ^11.3.1
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

  # Added the assets folder here
  assets:
    - assets/images/
    
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  web:
    generate: true
    image_path: "assets/logo.png"

dependency_overrides:
  ffi: ^2.1.3